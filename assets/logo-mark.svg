<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SubaByte">
  <!-- Suba-byte: S + eight bits -->
  <rect width="64" height="64" rx="16" fill="#0f766e"/>
  <!-- Eight bits of a byte (1 1 0 1 0 1 1 0) -->
  <g fill="#ffffff">
    <rect x="10" y="34" width="4.5" height="14" rx="2.25"/>
    <rect x="16.5" y="28" width="4.5" height="20" rx="2.25"/>
    <rect x="23" y="38" width="4.5" height="10" rx="2.25" opacity="0.35"/>
    <rect x="29.5" y="30" width="4.5" height="18" rx="2.25"/>
    <rect x="36" y="40" width="4.5" height="8" rx="2.25" opacity="0.35"/>
    <rect x="42.5" y="26" width="4.5" height="22" rx="2.25"/>
    <rect x="49" y="32" width="4.5" height="16" rx="2.25"/>
    <rect x="55.5" y="38" width="4.5" height="10" rx="2.25" opacity="0.35"/>
  </g>
  <!-- Suba S -->
  <path
    d="M42 14c-9.5 0-14 5-16 9.5S22 32 14 32"
    fill="none"
    stroke="#f0fdfa"
    stroke-width="4"
    stroke-linecap="round"
  />
</svg>
