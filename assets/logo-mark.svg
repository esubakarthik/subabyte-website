    <path d="M28 16c-5.5 0-9 2.8-9 6.5 0 3.2 2.4 5 7.2 6.2l2.3.6c5.5 1.4 8.5 3.6 8.5 8.2 0 5.2-4.6 8.5-11.2 8.5-6.2 0-10.4-2.8-11.4-7.2"/>
